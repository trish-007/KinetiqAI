<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kinetiq AI - Edge Biomechanics Engine</title>
  <style>
    body {
      background-color: #070b12;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .card {
      background-color: #0e1526;
      border: 1px solid #1e293b;
      border-radius: 16px;
      padding: 2.5rem;
      max-width: 550px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }
    h1 {
      color: #06b6d4;
      margin-top: 0;
      font-size: 2rem;
    }
    .badge {
      display: inline-block;
      background: #1e293b;
      color: #10b981;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 1.2rem;
    }
    p {
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .btn {
      display: inline-block;
      background: #06b6d4;
      color: #000;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0891b2;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">● System Online</div>
    <h1>⚡ Kinetiq AI</h1>
    <p>Real-Time Edge Biomechanics, Concentric Velocity Loss Quantification & Indigenous Nutrition Engine powered by Google Gemini.</p>
    <a class="btn" href="https://github.com" target="_blank">View GitHub Repository</a>
  </div>
</body>
</html>
